<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Trie Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,700&family=Creepster&family=Special+Elite&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Beige Cream — classic theme */
        --font-heading: 'Cormorant Garamond', Georgia, serif;
        --font-body: 'Source Sans 3', system-ui, sans-serif;

        --color-bg: #fff3d5;
        --color-surface: #fff8e8;
        --color-text: #1b4332;
        --color-text-muted: #3d5a45;
        --color-border: #c9b896;

        --color-primary: #1b4332;
        --color-primary-contrast: #fff3d5;
        --color-primary-hover: #2d6a4f;
        --color-secondary: #2d6a4f;
        --color-secondary-hover: #40916c;
        --color-accent: #40916c;
        --color-accent-hover: #2d6a4f;

        --color-success: #2d6a4f;
        --color-error: #9b2226;
        --color-info: #386641;

        --color-highlight: #95d5b2;
        --color-highlight-text: #1b4332;
        --color-highlight-border: #40916c;
        --color-end-of-word: #b7e4c7;
        --color-end-of-word-text: #1b4332;
        --color-end-of-word-border: #40916c;
        --color-node-bg: #fff3d5;
        --color-node-border: #1b4332;
        --color-connector: #2d6a4f;

        --shadow: 0 4px 6px -1px rgb(27 67 50 / 0.12), 0 2px 4px -2px rgb(27 67 50 / 0.08);
        --shadow-lg: 0 10px 15px -3px rgb(27 67 50 / 0.14), 0 4px 6px -4px rgb(27 67 50 / 0.1);
      }

      [data-theme="spooky"] {
        /* Rotten Pumpkin Dream */
        --font-heading: 'Creepster', cursive;
        --font-body: 'Special Elite', cursive;

        --color-bg: #1f1c24;
        --color-surface: #2a2433;
        --color-text: #fff3d5;
        --color-text-muted: #c9b896;
        --color-border: #4b006e;

        --color-primary: #ffc300;
        --color-primary-contrast: #1f1c24;
        --color-primary-hover: #e6b000;
        --color-secondary: #6b9e4d;
        --color-secondary-hover: #5a8640;
        --color-accent: #d85c00;
        --color-accent-hover: #b84d00;

        --color-success: #6b9e4d;
        --color-error: #d85c00;
        --color-info: #ffc300;

        --color-highlight: #ffc300;
        --color-highlight-text: #1f1c24;
        --color-highlight-border: #ffc300;
        --color-end-of-word: #d85c00;
        --color-end-of-word-text: #1f1c24;
        --color-end-of-word-border: #ffc300;
        --color-node-bg: #1f1c24;
        --color-node-border: #6b9e4d;
        --color-connector: #4b006e;

        --shadow: 0 10px 20px -5px rgb(0 0 0 / 0.55), 0 0 24px rgb(255 195 0 / 0.08);
        --shadow-lg: 0 20px 30px -8px rgb(0 0 0 / 0.65), 0 0 32px rgb(216 92 0 / 0.15);
      }

      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-body);
        transition: background-color 0.5s ease;
      }

      .bg-spooky-pattern {
        background-color: var(--color-bg);
        background-image:
          radial-gradient(ellipse 80% 50% at 50% 100%, rgb(75 0 110 / 0.35), transparent 55%),
          radial-gradient(circle at 20% 20%, rgb(107 158 77 / 0.12), transparent 40%),
          radial-gradient(circle at 80% 30%, rgb(255 195 0 / 0.06), transparent 35%);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
